# Example pre-commit configuration (official documentation: https://pre-commit.com)
#
# Run the two deterministic CI merge gates at local commit time to catch broken changes
# before pushing. If an assertion fails in either hook, it exits with a nonzero status
# and blocks the commit.
#
# 1) detections: runs only for commits changing detection rules (detections/), their pinned
#    upstream sources, or inline Sigma templates in the defense guides (docs/defense-{ko,en}.md).
#    The runner (detections/tests/run-all.sh) executes eight detection tests and three gates.
#    It checks the same rule/source scope as CI (.github/workflows/detections.yml), catching
#    rule changes without corresponding test/layer updates, and defense template changes
#    without updated guide claims. Docker is required: each test runs in an isolated container
#    without installing anything on the runner.
# 2) docs: checks that repository-local links, images, and heading anchors in tracked Markdown
#    point to existing targets (scripts/check-doc-links.py). It runs the same check as CI
#    (.github/workflows/docs.yml), without restricting the file scope (always_run), matching
#    the CI workflow that runs on all changes without a paths filter. Links can break when
#    targets (images, LICENSE, etc.) are deleted or moved, even without Markdown edits.
#    Uses only the Python standard library, with no network or Docker; finishes in tens of milliseconds.
#
# Install:      pip install pre-commit && pre-commit install
# Run manually: pre-commit run detections --all-files
#              pre-commit run docs --all-files
#
# Minimal example with two hooks. Add your own hooks below for Go or web linting.
repos:
  - repo: local
    hooks:
      - id: detections
        name: Eight detection rule tests (Sigma, Suricata, ATT&CK, indicators, MISP)
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-(ko|en)\.md)'
      - id: docs
        name: Check internal document links, images, and heading anchors
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
