name: detections
# On pushes and PRs that change detection rules (Sigma, Suricata, or ATT&CK layers),
# use reproducible tests to check that rules fire, convert to multiple SIEM backends,
# agree with coverage layers, preserve upstream indicators, and pass the full SigmaHQ
# convention checks. Rule changes without corresponding test/layer updates fail here.
# This enforces the eight-test contribution contract documented in CONTRIBUTING.md
# and detections/tests/README.md. Go builds, static analysis, and tests run in ci.yml.
# Three additional gates run alongside the eight rule tests: harness registry sync,
# the host triage tool self-test (detections/triage/artex_host_triage.py), and consistency
# checks for the inline Sigma correlation template in the defense guides
# (docs/defense-{ko,en}.md). run-all.sh runs the same three non-rule gates.
# The third gate reproduces the documented template claims: sigma check passes,
# splunk/eql/loki conversion works, lucene/kusto lack correlation support, and ko/en
# rule bodies match. This catches documentation drift after upstream backend upgrades.
#
# The eight tests need only Docker, which is included on ubuntu-latest runners.
# The runner downloads sigma-cli, scapy, suricata, and Python images and runs them
# in isolated containers without installing anything on the host. Rules and source
# files referenced by indicators are mounted read-only. Besides detections/ changes,
# run when pinned indicator sources change: enrich/selfupdate/guard/db User-Agents,
# markers, destructive-command tokens, default listen/proxy ports in cmd/artex/main.go,
# MITM CA certificate names in traffic/traffic.go, and graph schema fingerprints
# in db/schema.sql. This catches source changes that silently stale rules/indicators.
# Public Docker images are downloaded without authentication, so rare Docker Hub
# rate limits may occur; rerun the job if that happens.
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      # The third gate reads these defense-guide templates.
      # Include them in triggers so template changes are revalidated.
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# Cancel the previous run when a new push arrives on the same branch to avoid
# accumulating unnecessary runs during frequent pushes.
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test harness registry sync (run-all.sh ↔ CI ↔ directories)
        run: detections/tests/check-harness-sync.sh
      - name: Host triage tool self-test (artex_host_triage.py --self-test · non-rule gate)
        run: detections/tests/triage-selftest.sh
      - name: Defense guide inline Sigma template consistency (sigma check, conversion matrix, matching ko/en bodies · non-rule gate)
        run: detections/tests/check-defense-template.sh
      - name: Sigma rule reproduction (sigma check + backend conversion + indicator preservation)
        run: detections/tests/sigma/run.sh
      - name: Sigma event matching (atomic/correlation rules fire on malicious samples/timelines and stay silent on benign ones)
        run: detections/tests/sigma_match/run.sh
      - name: SigmaHQ convention lint (full validator set + documented baseline)
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma backend portability (correlation rule conversion across multiple backends)
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata rule reproduction (generate pcap → suricata -r → assert alert counts)
        run: detections/tests/suricata/run.sh
      - name: ATT&CK layer ↔ rule consistency
        run: detections/tests/attack/run.sh
      - name: Detection indicators ↔ upstream source consistency (upstream resync drift guard)
        run: detections/tests/indicators/run.sh
      - name: MISP indicator export ↔ CSV sync (validate MISP format with pymisp)
        run: detections/tests/misp/run.sh
