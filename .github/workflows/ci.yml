name: ci
# Run builds, static analysis, and tests on every push and PR to catch regressions
# from Korean localization before merging. The release workflow (release.yml) only
# builds and deploys v* tags, so this workflow validates everyday changes.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Build, analyze, and test without a database, reproducing the environment of a
  # contributor who clones the repository and runs `go test ./...` without PostgreSQL.
  # Integration tests that require a database use t.Skipf here (skips count as passes),
  # so builds, go vet, and all database-independent unit tests must pass.
  # This also catches regressions across package boundaries, such as changing text
  # in one package and breaking assertions in another, before merging.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (no DB — integration tests skipped)
        run: go test ./... -count=1
      - name: Docker credential import tests
        run: python3 -m unittest discover -s scripts -p test_docker_entrypoint.py -v

  # Run integration tests that require real PostgreSQL (notifications, evidence, usage metering).
  # Exercise paths skipped by the go job (channel validation, evidence storage, llm_usage)
  # against a real database to catch localization regressions limited to DB integration.
  #
  # The upstream harness shares one database across all packages, creates tables once,
  # and reuses them, implicitly depending on package execution order and accumulated data.
  # Running everything against one database therefore causes several kinds of failures:
  # accumulated data contamination, connection teardown races, and cross-package schema dependencies.
  # Instead, each package gets its own PostgreSQL service and runs against an empty database.
  # Each package runs as an independent matrix job and cannot touch another job's data,
  # connections, or schema. db.Open migrates the schema automatically; tables it does not
  # create, such as llm_usage, are ensured by the tests using EnsureLLMUsageTable.
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test (DB integration · isolated package ${{ matrix.pkg }})
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
