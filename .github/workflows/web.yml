name: web
# Build the static export of the Korean UI (web/) on every push and PR to catch
# frontend regressions before merging. The release workflow (release.yml) builds web
# only on v* tags; this fork had never pushed such a tag when this check was added.
# This workflow validates everyday web changes (TypeScript, React, i18n, next-intl).
# Go builds/tests run in ci.yml, so this workflow uses a web/ paths filter.
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # The static export build is a merge gate. `NEXT_EXPORT=1 next build` also checks
  # TypeScript types because next.config does not enable typescript.ignoreBuildErrors.
  # Type errors or export failures therefore fail this job and block merging.
  #
  # Biome lint is also a merge gate. After inherited upstream lint debt (G7) was cleared
  # (8 errors to 0: 6 skills-tree a11y, 1 package.json formatting, 1 logo.svg noSvgWithoutTitle),
  # the informational step was promoted to a gate. Errors from `npm run check`
  # (biome check) now fail this job, preventing regressions from the clean baseline.
  # Warnings and informational messages do not block merging; only errors exit nonzero.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Unit tests (merge gate · vitest)
        # Catch regressions in pure logic (getInitials/formatCurrency, i18n config, statusMeta) and i18n keys before merging.
        run: npm run test -- --run
      - name: i18n locale key consistency (merge gate · five locales match ko)
        # Require en/zh/es/ja to have exactly the same key set as ko.json; missing and extra keys both fail.
        run: npm run check:i18n
      - name: build:static (merge gate · includes type checking)
        run: npm run build:static
      - name: UI Han character leak guard (merge gate · zero Chinese characters in out HTML)
        # This fork guarantees that user-facing screens contain no unintended Chinese text.
        # Catch hardcoded Chinese strings and missing translations before merging.
        # The script finds web/out from the Git root regardless of the working directory.
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check (merge gate · maintain zero lint, format, and a11y errors)
        if: always()
        run: npm run check
