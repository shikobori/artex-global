name: docs
# On every push and PR, check that internal links and image references in tracked
# Markdown documents resolve to existing files, and that heading anchors resolve
# to real headings in the target documents. This prevents broken references from merging.
# Targets may be anywhere in the repository (e.g. ../LICENSE or screenshots/en/*.png),
# so run on all changes without a paths filter. External URLs (http/https/mailto)
# depend on the network and can be flaky; scripts/check-doc-links.py checks only internal references.
# The script uses only the Python standard library and no network, making it deterministic
# and independent of external failures such as Docker Hub rate limits. Go checks run in
# ci.yml, detection reproduction in detections.yml, and Korean UI builds in web.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Cancel the previous run on a new push to the same branch to avoid unnecessary runs.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on ubuntu-latest, and the script uses only the standard
      # library, so no installation step is needed. Use -I to isolate the user site
      # and environment.
      - name: Check internal document links, images, and anchors
        run: python3 -I scripts/check-doc-links.py
