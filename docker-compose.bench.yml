# ARTEX Tencent TSec Benchmark image: build and run locally with one command.
# Independent of the production docker-compose.yml (artex + postgres services).
# Usage:
#   cp bench/.env.example bench/.env   # Set LLM_API_KEY, BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in the foreground (view logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # Run in the background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop (add -v to also remove volumes)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share host networking so the container can directly access target networks on the host/VPN.
    # Host mode needs no port mappings: the container binds host ports 8787 (UI/API), 8788 (proxy),
    # and 5432 (internal PostgreSQL). Ensure all three are free by stopping conflicting services before testing.
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
