name: external-links
# Check that external links in tracked Markdown still work: defense-guide incident
# reporting sites (boho.or.kr, privacy.go.kr, pipc.go.kr, fsec.or.kr), CISA KEV, OWASP,
# SigmaHQ, Suricata, MITRE, MISP, the original demo, GitHub badges, and others. These
# checks depend on network/server policies and can be flaky, so docs.yml excludes them.
# Run weekly or manually (workflow_dispatch), rather than on pushes/PRs, without blocking merges.
# Scheduled failures reveal changed or closed links. Internal links run in docs.yml,
# Go checks in ci.yml, detection rules in detections.yml, and Korean UI builds in web.yml.
#
# --strict fails only on DOWN results (404/410/5xx or DNS/connection errors) absent
# from scripts/external-links-allowlist.txt. RESTRICTED results (live hosts with bot
# blocking/rate limits) and ALLOWED results (unfixable inherited upstream links) do not fail.
# A failed check signals a newly broken link curated by our documentation. Scheduled
# workflows run only on the default branch (main).
on:
  schedule:
    - cron: "17 0 * * 1" # Every Monday at 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on ubuntu-latest; the script uses only the standard
      # library. No installation is needed. Use -I to isolate the user site and environment.
      - name: Check external links (browser UA, GET, redirects · allowlist excluded · non-blocking)
        run: python3 -I scripts/check-external-links.py --strict
