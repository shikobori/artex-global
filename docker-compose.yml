services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Compile the frontend and Linux binary inside Docker.
    image: artex:local
    pull_policy: never
    platform: linux/amd64
    build:
      context: .
      target: local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Paste the complete auth.json as a single-quoted value in .env.
      # The entrypoint imports it once, then removes it from ARTEX's environment.
      ARTEX_CODEX_AUTH_JSON: ${ARTEX_CODEX_AUTH_JSON:-}
      # Alternative: a Codex-scoped personal access token (at-...).
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      CODEX_HOME: /app/data/codex
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # First-run protection. When blank, a random setup token is printed in the startup logs;
      # enter it at /setup to create the administrator password (see docker compose logs artex).
      # ARTEX_ADMIN_PASSWORD initializes the password directly without /setup (at least 8 characters).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # Browser cross-origin allowlist, comma-separated. Usually blank for the same-origin embedded UI.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      # Default server output language (en, ko, zh, es, ja). Defaults to English when empty. Display Language
      # in Settings overrides agent output and error messages; server console logs follow only this value.
      ARTEX_LANG: ${ARTEX_LANG:-}
    ports:
      # Published only on host address 127.0.0.1 by default. For direct access from other devices,
      # set ARTEX_BIND=0.0.0.0 in .env after completing initial setup (administrator password).
      # Use the HTTPS reverse proxy configuration in README where possible.
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (including jwt.key and SQLite) to data/ in the project root.
      # This allows direct inspection and backups on the host and survives container recreation.
      - ./data:/app/data
      # Mount skills from the project root, replacing /app/skills bundled in the image.
      # The container reads these host files directly, so skill changes do not require an image rebuild.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
